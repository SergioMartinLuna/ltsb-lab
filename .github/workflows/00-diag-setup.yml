name: 00-diag-setup

# Diagnostico RAPIDO: arranca la VM del instalador durante unos minutos, captura
# la pantalla por el monitor HMP de QEMU y sube las imagenes. Sirve para ver de
# inmediato en que pantalla se queda Windows Setup, sin esperar al ciclo completo.

on:
  workflow_dispatch:
    inputs:
      variante:
        description: 'Bus del disco destino (unica variable de este round)'
        required: false
        default: 'ide'
        type: choice
        options:
          - ide
          - virtio

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: preparar
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils socat netpbm python3 cpu-checker > /dev/null
          mkdir -p iso/partes lab medicion/pantallas
          # /dev/kvm es root:kvm 0660 y runner no esta en el grupo kvm: sin sudo,
          # QEMU muere con "Could not access KVM kernel module: Permission denied".
          if sudo kvm-ok 2>&1 | grep -q 'KVM acceleration can be used'; then
            echo "KVM disponible"
          else
            echo "::error::KVM no disponible"; exit 1
          fi

      - name: descargar-iso
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/SergioMartinLuna/ltsb-lab/releases/download/iso-14393/iso-14393.part"
          for i in $(seq 0 31); do
            f=$(printf 'iso/partes/p%02d' "$i")
            code=$(curl -sSL -w '%{http_code}' -o "$f" "$BASE$(printf '%02d' "$i")")
            if [ "$code" != "200" ]; then rm -f "$f"; break; fi
            echo "descargado $f ($(stat -c%s "$f") bytes)"
          done
          cat iso/partes/p* > iso/instalador.iso
          rm -rf iso/partes
          echo "ISO ensamblada: $(stat -c%s iso/instalador.iso) bytes"
          echo "3874bc7160ed10f28744dc2b00f9518af99e706296b969fb7eaf26009e1caf76  instalador.iso" > iso/esperado.sha256
          ( cd iso && sha256sum -c esperado.sha256 )

      - name: montar-y-autodetectar
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq wimtools dosfstools mtools > /dev/null
          sudo mkdir -p iso/montada
          sudo mount -o loop,ro iso/instalador.iso iso/montada
          WIM=$(sudo find iso/montada -maxdepth 3 -name install.wim | head -1)
          INDICE=$(sudo wiminfo "$WIM" | awk '
              /^Available Images/ {f=1; next}
              f && /^ *Index: *[0-9]+/ {idx=$2; next}
              f && /^ *Name:/ { if (match($0,/(Enterprise|LTSB)/) && w=="") w=idx; if (fb=="") fb=idx }
              END { print (w!="" ? w : fb) }')
          echo "install.wim=$WIM indice=$INDICE"

          # BISECADO: Setup responde "The answer file is invalid for pass
          # [windowsPE]" y no dice QUE elemento. Se generan 5 variantes para
          # localizar el culpable en una sola oleada de ejecuciones:
          #   A = minimo: solo DiskConfiguration + UserData(AcceptEula) + ImageInstall
          #   B = A + componente International-Core-WinPE
          #   C = A + Compact
          #   D = A + ProductKey
          #   E = todo (el unattend de la sonda)
          # ROUND 4. Lo queazoo rondas anteriores dejaron aislado:
          #   - wcm:namespace, el layout de particiones y WillWipeDisk NO son la
          #     causa: las 4 variantes fallaron igual (runs 37113492783..21293).
          #   - El componente International-Core-WinPE no es la causa en si mismo:
          #     lo unico que hace es saltarse la pantalla de idioma, con lo que
          #     Setup llega a intentar aplicar el disco y aBJAR el error.
          #   - El mensaje es "Windows could not apply the unattend answer file's
          #     <DiskConfiguration> setting", es decir Setup NO PUEDE aplicar el
          #     disco, no que el XML este mal.
          # Hipotesis: el disco destino esta en virtio-blk y el WinPE de la ISO de
          # Microsoft NO trae ese controlador, asi que Setup no ve ningun disco y
          # no puede aplicar DiskConfiguration. Sin el componente de idioma Setup se
          # queda antes, en la pantalla de idioma, y el problema queda oculto.
          # Se mantiene el XML identico al de la sonda y solo cambia el bus.
          VARIANTE="${{ github.event.inputs.variante }}"
          VARIANTE="${VARIANTE:-ide}"
          BUS="$VARIANTE"
          echo "bus del disco a probar: $BUS"
          LANG=2; WU=1; COMPACT=0; KEY=0; NS=1; LAYOUT=dos; WIPE=1

          {
          cat <<'HEAD'
          <?xml version="1.0" encoding="utf-8"?>
          <unattend xmlns="urn:schemas-microsoft-com:unattend"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">
            <settings pass="windowsPE">
          HEAD

          if [ "$LANG" != "0" ]; then
            if [ "$LANG" = "1" ]; then
              cat <<'LANG'
              <component name="Microsoft-Windows-International-Core-WinPE"
                         processorArchitecture="amd64"
                         publicKeyToken="31bf3856ad364e35"
                         language="neutral" versionScope="nonSxS">
                <SetupUILanguage><UILanguage>en-US</UILanguage></SetupUILanguage>
                <InputLocale>0409:00000409</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>
              </component>
          LANG
            else
              cat <<'LANG'
              <component name="Microsoft-Windows-International-Core-WinPE"
                         processorArchitecture="amd64"
                         publicKeyToken="31bf3856ad364e35"
                         language="neutral" versionScope="nonSxS">
                <SetupUILanguage><UILanguage>en-US</UILanguage></SetupUILanguage>
                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>
              </component>
          LANG
            fi
          fi

          cat <<'SETUP'
              <component name="Microsoft-Windows-Setup"
                         processorArchitecture="amd64"
                         publicKeyToken="31bf3856ad364e35"
                         language="neutral" versionScope="nonSxS">
                <DiskConfiguration>
                  <Disk wcm:action="add"<!--NS-->>
                    <DiskID>0</DiskID>
                    <!--WIPE-->
          SETUP

          if [ "$LAYOUT" = "dos" ]; then
          cat <<'CPDOS'
                    <CreatePartitions>
                      <CreatePartition wcm:action="add">
                        <Order>1</Order><Size>2048</Size><Type>Primary</Type>
                      </CreatePartition>
                      <CreatePartition wcm:action="add">
                        <Order>2</Order><Type>Primary</Type><Extend>true</Extend>
                      </CreatePartition>
                    </CreatePartitions>
                    <ModifyPartitions>
                      <ModifyPartition wcm:action="add">
                        <Order>1</Order><PartitionID>1</PartitionID>
                        <Format>NTFS</Format><Label>System</Label>
                      </ModifyPartition>
                      <ModifyPartition wcm:action="add">
                        <Order>2</Order><PartitionID>2</PartitionID><Active>true</Active>
                        <Format>NTFS</Format><Label>Windows</Label>
                      </ModifyPartition>
                    </ModifyPartitions>
          CPDOS
          else
          cat <<'CPUNO'
                    <CreatePartitions>
                      <CreatePartition wcm:action="add">
                        <Order>1</Order><Type>Primary</Type><Extend>true</Extend>
                      </CreatePartition>
                    </CreatePartitions>
                    <ModifyPartitions>
                      <ModifyPartition wcm:action="add">
                        <Order>1</Order><PartitionID>1</PartitionID><Active>true</Active>
                        <Format>NTFS</Format><Label>Windows</Label>
                      </ModifyPartition>
                    </ModifyPartitions>
          CPUNO
          fi

          cat <<'POST'
                  </Disk>
                  <!--WUI-->
                </DiskConfiguration>
                <!-- ImageInstall y UserData son HERMANOS de DiskConfiguration, no
                     hijos: anidados son invalidos aunque el XML sea well-formed. -->
                <ImageInstall>
                  <OSImage>
                    <InstallFrom>
                      <MetaData wcm:action="add">
                        <Key>/IMAGE/INDEX</Key>
                        <Value>IDX</Value>
                      </MetaData>
                    </InstallFrom>
                    <InstallTo><DiskID>0</DiskID><PartitionID>2</PartitionID></InstallTo>
          POST

          if [ "$COMPACT" = "1" ]; then
          cat <<'CMP'
                    <WillShowUI>OnError</WillShowUI>
                    <Compact>true</Compact>
          CMP
          fi

          cat <<'MID'
                  </OSImage>
                </ImageInstall>
                <UserData>
                  <AcceptEula>true</AcceptEula>
          MID

          if [ "$KEY" = "1" ]; then
          cat <<'KEY'
                  <ProductKey><Key>A00001-00000-00000-00000-00000</Key></ProductKey>
          KEY
          fi

          cat <<'TAIL'
                </UserData>
              </component>
            </settings>
          </unattend>
          TAIL
          } > aio.xml

          sed -i "s|IDX|$INDICE|" aio.xml
          # Marcadores opcionales resueltos con sed: WillShowUI en
          # DiskConfiguration, wcm:namespace en el elemento Disk y WillWipeDisk.
          # Se evitan asi los heredocs anidados, que rompian el cierre de SETUP.
          if [ "$WU" = "1" ]; then
            sed -i 's|<!--WUI-->|<WillShowUI>OnError</WillShowUI>|' aio.xml
          else
            sed -i 's|<!--WUI-->||' aio.xml
          fi
          if [ "$NS" = "1" ]; then
            sed -i 's|<!--NS-->| wcm:namespace="\\?\\root\\wcs#diskvol0"|' aio.xml
          else
            sed -i 's|<!--NS-->||' aio.xml
          fi
          if [ "$WIPE" = "1" ]; then
            sed -i 's|<!--WIPE-->|<WillWipeDisk>true</WillWipeDisk>|' aio.xml
          else
            sed -i 's|<!--WIPE-->||' aio.xml
          fi
          xmllint --noout aio.xml && echo "aio.xml well-formed"
          echo "=== unattend de la variante $VARIANTE ==="
          cat aio.xml

          dd if=/dev/zero of=autounattend.img bs=1M count=16 status=none
          mkfs.vfat -F 16 -n UNATTEND autounattend.img > /dev/null
          mcopy -i autounattend.img aio.xml ::autounattend.xml

          # Ademas del CD, una COPIA EN DISQUETE (fd0). Setup busca autounattend.xml
          # por orden: disquete, CD/DVD, USB. Con el archivo solo en el segundo CD
          # (ata0-1, slave) Setup se quedaba en la pantalla de idioma sin instalar.
          rm -f autounattend.flp
          dd if=/dev/zero of=autounattend.flp bs=512 count=2880 status=none
          mkfs.vfat -F 12 -n UNATTEND autounattend.flp > /dev/null
          mcopy -i autounattend.flp aio.xml ::autounattend.xml
          echo "--- imagen FAT (disquete 1.44 MB) ---"
          mdir -i autounattend.flp ::
          echo "--- imagen FAT (CD) ---"
          mdir -i autounattend.img ::

          qemu-img create -f qcow2 lab/destino.qcow2 20G > /dev/null
          sudo umount iso/montada

      - name: cliente-hmp
        shell: bash
        run: |
          set -euo pipefail
          # Cliente HMP en Python: socat escribiendo y cerrando no es fiable,
          # por eso el bucle de socat de la sonda no produjo ninguna captura.
          cat > hmp.py <<'PY'
          import socket, sys, time

          def hmp(sock_path, comando):
              s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              s.settimeout(15)
              try:
                  s.connect(sock_path)
                  time.sleep(0.3)
                  try:
                      s.recv(65536)
                  except Exception:
                      pass
                  s.sendall((comando + "\n").encode())
                  time.sleep(1.5)
                  try:
                      return s.recv(65536).decode(errors="replace")
                  except Exception:
                      return ""
              finally:
                  s.close()

          ruta = sys.argv[1]
          salida = sys.argv[2]
          limite = int(sys.argv[3])
          for i in range(1, limite + 1):
              time.sleep(30)
              destino = "%s/t%02d.ppm" % (salida, i)
              r = hmp(ruta, 'screendump "%s"' % destino)
              print("captura %02d -> %s" % (i, destino), flush=True)
              print("   respuesta: %r" % (r.strip()[:120],), flush=True)
          PY
          echo "hmp.py escrito"

      - name: arrancar-y-capturar
        shell: bash
        run: |
          set -uo pipefail
          SOCK="$PWD/monitor.sock"
          rm -f "$SOCK"

          # -machine pc (i440fx) y no q35: q35 no tiene controlador IDE real y
          # "if=ide" no es de fiar ahi. i440fx lleva PIIX3 IDE, que es lo que
          # espera un instalador de Windows 10 arrancando por BIOS.
          #
          # El bus del disco destino es la variable de este round:
          #   virtio -> virtio-blk, que el WinPE de la ISO de Microsoft no trae
          #   ide    -> PIIX3 IDE, que WinPE ya enumera sin inyectar drivers
          if [ "$BUS" = "ide" ]; then
            DEST="-drive file=lab/destino.qcow2,if=none,id=disk0,format=qcow2 -device ide-hd,drive=disk0,bus=ide.0,unit=0"
            echo "disco destino en IDE (ide.0.0)"
          else
            DEST="-drive file=lab/destino.qcow2,if=virtio,format=qcow2"
            echo "disco destino en virtio-blk"
          fi

          sudo qemu-system-x86_64 \
            -accel kvm -m 4096 -smp 2 -machine pc -vga std \
            $DEST \
            -drive file=iso/instalador.iso,if=none,id=cd0,media=cdrom,readonly=on \
              -device ide-cd,drive=cd0,bus=ide.1,unit=0 \
            -drive file=autounattend.img,if=none,id=cd1,media=cdrom,readonly=on \
              -device ide-cd,drive=cd1,bus=ide.1,unit=1 \
            -drive file=autounattend.flp,if=floppy,format=raw \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -display none -serial file:consola.log \
            -monitor "unix:$SOCK,server,nowait" \
            -debugcon file:debugcon.log -global isa-debugcon.iobase=0x402 \
            -boot order=d \
            -no-reboot > qemu-stdout.log 2>&1 &
          QPID=$!
          echo "qemu pid=$QPID"
          sleep 8
          if ! kill -0 "$QPID" 2>/dev/null; then
            echo "::error::QEMU ya habia terminado:"
            cat qemu-stdout.log
            exit 1
          fi
          ls -la monitor.sock 2>&1 || echo "SIN SOCKET"
          sudo chmod 0666 monitor.sock && echo "monitor.sock permiso 0666"

          # Dos senales textuales, sin depender de imagenes:
          #  a) /proc/PID/io -> cuanto lee QEMU de la ISO (QEMU va como root,
          #     asi que hay que leerlo con sudo o no es legible).
          #  b) crecimiento del qcow2 -> si Setup empezo a instalar, el disco crece.
          echo "ts	destino_bytes	leido_bytes	escrito_bytes"
          for i in $(seq 1 24); do
            IO=$(sudo cat "/proc/$QPID/io" 2>/dev/null || true)
            DEST=$(du -b lab/destino.qcow2 2>/dev/null | cut -f1 || echo 0)
            RB=$(printf '%s' "$IO" | awk '/^read_bytes/{print $2}')
            WB=$(printf '%s' "$IO" | awk '/^write_bytes/{print $2}')
            printf '%s\t%s\t%s\t%s\n' "$(date +%s)" "${DEST:-0}" "${RB:-?}" "${WB:-?}" \
              | tee -a medicion/io.tsv
            sleep 15
          done

          python3 hmp.py "$SOCK" medicion/pantallas 8
          echo "--- capturas obtenidas ---"
          ls -la medicion/pantallas

          echo "--- DEBUGCON de SeaBIOS (prueba de arranque) ---"
          cat debugcon.log 2>/dev/null | tail -40 || echo "sin debugcon.log"

          kill "$QPID" 2>/dev/null || true
          sleep 2
          echo "--- tamano del disco destino ---"
          du -b lab/destino.qcow2 || true

      - name: convertir-y-subir
        if: always()
        shell: bash
        run: |
          for f in medicion/pantallas/*.ppm; do
            [ -e "$f" ] || continue
            pnmtopng "$f" > "${f%.ppm}.png" 2>/dev/null && rm -f "$f"
          done
          ls -la medicion/pantallas || true
          cp qemu-stdout.log consola.log debugcon.log medicion/ 2>/dev/null || true

          # OCR de las capturas. Necesitamos el TEXTO de la pantalla, no la imagen:
          # es la unica forma de saber si Setup esta en la pantalla de idioma
          # (unattend no encontrado), en un dialogo de error, o instalando.
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng imagemagick > /dev/null 2>&1 || true
          if command -v tesseract > /dev/null 2>&1; then
            echo "tesseract disponible: $(tesseract --version 2>&1 | head -1)"
            for f in medicion/pantallas/t*.png; do
              [ -e "$f" ] || continue
              b="${f%.png}"
              # Escalar x2 y normalizar el contraste: sobre la captura cruda el
              # OCR sale fragmentado y no se distingue el mensaje de Setup.
              convert "$f" -colorspace Gray -normalize -resize 200% "$b.big.png" 2>/dev/null || cp "$f" "$b.big.png"
              tesseract "$b.big.png" "$b"      -l eng --psm 6  2>/dev/null || true
              tesseract "$b.big.png" "${b}.s" -l eng --psm 11 2>/dev/null || true
            done
            rm -f medicion/pantallas/*.big.png
            for t in medicion/pantallas/t*.txt; do
              [ -e "$t" ] || continue
              echo "===== $(basename "$t") ====="
              cat "$t"
            done
          else
            echo "::warning::tesseract no disponible, sin OCR"
          fi

      - name: subir
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-setup
          path: medicion/