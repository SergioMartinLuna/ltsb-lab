name: 10-sonda-disco-construccion

# EXP-001 — Mide el pico REAL de almacenamiento al construir la base 14393 con
# Windows Setup + Compact OS desde el inicio, dentro de un runner ubuntu-latest.
#
# NO construye la base definitiva: no publica la base en Releases. Solo sube el
# informe de medicion como artifact.
#
# Criterio de decision escrito ANTES de ejecutar (docs/00, regla 2):
#   VIABLE     <=> min(avail) >= 2.0 GB durante toda la corrida
#   NO VIABLE  <=> min(avail) < 2.0 GB, o Setup falla con 0x80070070
#
# La aceptacion solo es concluyente sobre el piso garantizado (14 GB libres antes
# de limpiar). Si el job aterriza en el SKU grande de repos publicos, el informe
# lo marca como NO CONCLUYENTE aunque el pico sea holgado.

on:
  workflow_dispatch:
    inputs:
      iso_repo:
        description: "owner/repo publico que aloja la ISO 14393 troceada"
        required: true
      iso_release_tag:
        description: "Tag del Release con los trozos de la ISO"
        required: true
      iso_asset_prefix:
        description: "Prefijo comun de los assets (p.ej. iso-14393.part)"
        required: true
      iso_sha256:
        description: "SHA256 de la ISO reassemblada (sin espacios, en hex)"
        required: true
      iso_size_bytes:
        description: "Tamano exacto de la ISO reassemblada, en bytes"
        required: true
      target_gb:
        description: "Disco destino para Windows, en GB"
        required: false
        default: "12"
      vm_ram_mb:
        description: "RAM de la VM, en MB"
        required: false
        default: "4096"
      wim_index:
        description: "Indice de imagen en install.wim; vacio = autodeteccion por nombre Enterprise"
        required: false
        default: ""
      watchdog_minutes:
        description: "Vigilante de QEMU en minutos; rc=124 significa que Setup no termino"
        required: false
        default: "150"

permissions:
  contents: read

jobs:
  medir:
    name: medir-pico-de-construccion
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      # ------------------------------------------------------------------
      # Etapa 0 — censo del runner, sin tocar nada
      # ------------------------------------------------------------------
      - name: censo-inicial
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p medicion
          {
            echo "## Etapa 0 — censo del runner sin modificar"
            echo
            echo "- repositorio: publico (4 vCPU / 16 GB / 4-core SKU)"
            echo "- version de imagen: \${ImageVersion:-desconocida}"
            echo
            echo '```'
            echo '$ nproc'
            nproc
            echo
            echo '$ free -b'
            free -b
            echo
            echo '$ df -B1 -T / /mnt 2>/dev/null || df -B1 -T /'
            df -B1 -T / /mnt 2>/dev/null || df -B1 -T /
            echo
            echo '$ lsblk -b -o NAME,SIZE,RO,TYPE,MOUNTPOINT'
            lsblk -b -o NAME,SIZE,RO,TYPE,MOUNTPOINT
            echo
            echo '$ ls -l /dev/kvm'
            ls -l /dev/kvm 2>&1 || true
            echo '```'
          } | tee medicion/00-censo-inicial.md

          AVAIL_INICIAL=$(df -B1 --output=avail / | tail -1 | tr -d ' ')
          echo "AVAIL_INICIAL_BYTES=$AVAIL_INICIAL" >> "$GITHUB_ENV"
          {
            echo "AVAIL_INICIAL_BYTES=$AVAIL_INICIAL"
            echo "DISCO_TOTAL_BYTES=$(df -B1 --output=size / | tail -1 | tr -d ' ')"
            echo "NPROC=$(nproc)"
          } > medicion/censo.csv

          # Clasificacion del SKU: define si el resultado es concluyente.
          if [ "$AVAIL_INICIAL" -ge 40000000000 ]; then
            SKU=grande
          else
            SKU=piso
          fi
          echo "SKU=$SKU" >> "$GITHUB_ENV"
          echo "::notice::AVAIL inicial = $AVAIL_INICIAL bytes; clasificado como SKU $SKU"

      # ------------------------------------------------------------------
      # Etapa 1 — liberar toolchains preinstaladas (presupuesto efectivo medido)
      # ------------------------------------------------------------------
      - name: liberar-espacio-y-medir-de-nuevo
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(df -B1 --output=avail / | tail -1 | tr -d ' ')

          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/google/chrome \
            /opt/microsoft/msedge \
            /opt/microsoft/powershell \
            /opt/pipx \
            /usr/lib/mono \
            /usr/local/julia* \
            /usr/local/lib/android \
            /usr/local/lib/node_modules \
            /usr/local/share/chromium \
            /usr/local/share/powershell \
            /usr/share/swift \
            /usr/lib/llvm-* \
            "${AGENT_TOOLSDIRECTORY:-/nonexistent}" 2>/dev/null || true
          sudo rm -rf /var/cache/apt/archives/*.deb 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true

          AFTER=$(df -B1 --output=avail / | tail -1 | tr -d ' ')
          GANADO=$(( AFTER - BEFORE ))
          echo "PRESUPUESTO_EFECTIVO_BYTES=$AFTER" >> "$GITHUB_ENV"
          {
            echo "AVAIL_ANTES_BYTES=$BEFORE"
            echo "AVAIL_DESPUES_BYTES=$AFTER"
            echo "RECUPERADO_BYTES=$GANADO"
          } >> medicion/censo.csv
          {
            echo
            echo "## Etapa 1 — presupuesto efectivo"
            echo
            echo "- libre antes de limpiar: $BEFORE bytes ($(awk "BEGIN{printf \"%.2f\", $BEFORE/1073741824}") GiB)"
            echo "- libre despues de limpiar: $AFTER bytes ($(awk "BEGIN{printf \"%.2f\", $AFTER/1073741824}") GiB)"
            echo "- **recuperado: $GANADO bytes ($(awk "BEGIN{printf \"%.2f\", $GANADO/1073741824}") GiB)**"
          } >> medicion/00-censo-inicial.md
          cat medicion/00-censo-inicial.md >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Etapa 2 — ISO desde nuestro propio Release, nunca de un tercero
      # ------------------------------------------------------------------
      - name: obtener-iso-desde-release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p iso/partes
          BASE="https://github.com/${{ github.event.inputs.iso_repo }}/releases/download/${{ github.event.inputs.iso_release_tag }}/${{ github.event.inputs.iso_asset_prefix }}"

          i=0
          while [ "$i" -lt 32 ]; do
            URL="$BASE$(printf '%02d' "$i")"
            CODIGO=$(curl -sS -L -o "iso/partes/p$i" -w '%{http_code}' "$URL" || true)
            if [ "$CODIGO" != "200" ]; then
              rm -f "iso/partes/p$i"
              break
            fi
            echo "descargado $URL -> $(stat -c %s "iso/partes/p$i") bytes"
            i=$((i + 1 ))
          done

          if [ "$i" -eq 0 ]; then
            echo "::error::no se descargo ningun trozo; revisa iso_repo / iso_release_tag / iso_asset_prefix"
            exit 1
          fi

          cat iso/partes/p* > iso/instalador.iso
          # Los trozos duplican el tamano de la ISO mientras se ensambla. Se
          # borran en el acto: durante el resto del job la ISO ocupa 3.33 GB,
          # no 6.66 GB.
          rm -rf iso/partes
          sync
          echo "trozos eliminados; ISO ensamblada: $(stat -c %s iso/instalador.iso) bytes"
          TAM=$(stat -c %s iso/instalador.iso)
          ESPERADO=${{ github.event.inputs.iso_size_bytes }}
          echo "ISO_BYTES=$TAM" >> "$GITHUB_ENV"
          if [ "$TAM" -ne "$ESPERADO" ]; then
            echo "::error::tamano de ISO inesperado: $TAM != $ESPERADO"
            exit 1
          fi

          # sha256sum -c exige el formato  "<hash>  <fichero>". Escribir solo el
          # hash hace que el paso aborte con "no properly formatted checksum lines".
          printf '%s  instalador.iso\n' "${{ github.event.inputs.iso_sha256 }}" | tr -d '\r' > iso/esperado.sha256
          echo "--- linea de verificacion ---"
          cat iso/esperado.sha256
          # Con -c, cualquier argumento extra se interpreta como OTRO fichero de
          # checksums que parsear, y aborta con exit 1. Solo el fichero de checksums.
          ( cd iso && sha256sum -c esperado.sha256 )

          sudo apt-get update -qq
          sudo apt-get install -y -qq wimtools > /dev/null

          sudo mkdir -p iso/montada
          sudo mount -o loop,ro iso/instalador.iso iso/montada
          echo "ISO montada. contenido raiz:"
          sudo ls iso/montada

          {
            echo "## Etapa 2 - ISO"
            echo
            echo "- bytes: $TAM"
            echo "- GiB: $(awk "BEGIN{printf \"%.3f\", $TAM/1073741824}")"
            echo "- sha256 verificado: si"
            echo "- ocupacion real en disco (du): $(du -B1 iso/instalador.iso | cut -f1) bytes"
            echo "- **no se copia al destino**: se adjunta como cdrom virtual de solo lectura"
          } | tee medicion/01-iso.md
          cat medicion/01-iso.md >> "$GITHUB_STEP_SUMMARY"

          echo "--- indice de imagenes en install.wim ---"
          sudo wiminfo iso/montada/sources/install.wim | tee medicion/install-wim-info.txt
          echo "--- indice de imagenes en boot.wim ---"
          sudo wiminfo iso/montada/sources/boot.wim | tee medicion/boot-wim-info.txt

          WIM=$(sudo find /mnt /media iso/montada -maxdepth 4 -name install.wim 2>/dev/null | head -1)
          [ -n "$WIM" ] || WIM=iso/montada/sources/install.wim
          {
            echo "install.wim en: $WIM"
            echo "--- sha256 de install.wim ---"
            sudo sha256sum "$WIM" | tee medicion/install-wim.sha256
            echo "--- sha256 de boot.wim ---"
            sudo sha256sum iso/montada/sources/boot.wim | tee medicion/boot-wim.sha256
          } >> medicion/01-iso.md

          # Descubre el indice de la imagen Enterprise/LTSB en vez de suponerlo.
          # OJO: en "Index:                  1" los campos awk son $1="Index:" y $2="1".
          # Usar $3 (error previo) deja idx vacio y la deteccion nunca dispara.
          INDICE=$(sudo wiminfo "$WIM" \
            | awk '
                /^Available Images/ {f=1; next}
                f && /^ *Index: *[0-9]+/ {idx=$2; next}
                f && /^ *Name:/ {
                  if (match($0, /(Enterprise|LTSB)/) && winner=="") winner=idx
                  if (fallback=="") fallback=idx
                }
                END { print (winner!="" ? winner : fallback) }')
          if [ -z "$INDICE" ]; then
            echo "::error::no se encontro ninguna imagen en el WIM de instalacion"
            exit 1
          fi
          # Evidencia: registra nombre y edicion de TODAS las imagenes candidatas.
          sudo wiminfo "$WIM" \
            | awk '/^Available Images/ {f=1; next} f && /^ *Index:/ {i=$2} f && /^ *(Name|Edition ID|Installation Type):/ {print "  " $0}' \
            | tee -a medicion/01-iso.md || true
          echo "INDICE_WIM=$INDICE" >> "$GITHUB_ENV"
          echo "imagen Enterprise detectada en el indice $INDICE" | tee -a medicion/01-iso.md
          cat medicion/01-iso.md >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Etapa 3 — herramientas y disco destino sparse
      # ------------------------------------------------------------------
      - name: preparar-disco-destino
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf socat > /dev/null
          mkdir -p lab
          df -B1 -T / | tail -1 > medicion/df-tras-qemu.txt
          df -B1 --output=avail / | tail -1 > medicion/avail-tras-qemu.txt

          # KVM: /dev/kvm suele existir y kvm-ok dice que es utilizable, pero es
          # root:kvm 0660 y el usuario runner NO esta en el grupo kvm. Por eso
          # "-accel kvm" fallaba con Permission denied pese a haber KVM.
          QEMU_PREFIJO=""
          if [ -e /dev/kvm ]; then
            if sudo kvm-ok 2>&1 | grep -q 'KVM acceleration can be used'; then
              if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
                echo "KVM utilizable directamente por $(id -un)"
              else
                QEMU_PREFIJO="sudo"
                echo "KVM utilizable solo como root; se ejecutara QEMU con sudo"
              fi
            else
              echo "::error::/dev/kvm existe pero kvm-ok no lo da por utilizable"
              sudo kvm-ok 2>&1 || true
              exit 1
            fi
          else
            echo "::error::no existe /dev/kvm en este runner"
            exit 1
          fi
          echo "QEMU_PREFIJO=$QEMU_PREFIJO" >> "$GITHUB_ENV"
          echo "aceleracion=kvm (prefijo='${QEMU_PREFIJO:-ninguno}')" | tee -a medicion/02-destino.md
          ls -l /dev/kvm | tee -a medicion/02-destino.md

          TARGET_GB=${{ github.event.inputs.target_gb }}
          qemu-img create -f qcow2 lab/objetivo.qcow2 "${TARGET_GB}G"
          {
            echo "## Etapa 3 — disco destino"
            echo
            echo "- logico: ${TARGET_GB} GiB (sparse, preallocation=off)"
            echo "- fisico inicial: $(du -B1 lab/objetivo.qcow2 | cut -f1) bytes"
          } | tee medicion/02-destino.md
          cat medicion/02-destino.md >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # Etapa 4 — unattend: Compact OS desde el inicio, sin hibernate ni pagefile
      # ------------------------------------------------------------------
      - name: escribir-unattend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p aio
          cat > aio/autoinstall.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- xmlns:wcm es OBLIGATORIO: todo el archivo usa atributos wcm:action y
               wcm:namespace. Sin esta declaracion el XML no es well-formed, Setup no
               lo parsea, cae en la UI interactiva y se queda esperando para siempre. -->
          <unattend xmlns="urn:schemas-microsoft-com:unattend"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <settings pass="windowsPE">
              <component name="Microsoft-Windows-International-Core-WinPE"
                         processorArchitecture="amd64"
                         publicKeyToken="31bf3856ad364e35"
                         language="neutral" versionScope="nonSxS">
                <SetupUILanguage><UILanguage>en-US</UILanguage></SetupUILanguage>
                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>
              </component>
              <component name="Microsoft-Windows-Setup"
                         processorArchitecture="amd64"
                         publicKeyToken="31bf3856ad364e35"
                         language="neutral" versionScope="nonSxS">
                <DiskConfiguration>
                  <Disk wcm:action="add" wcm:namespace="\\?\root\wcs#diskvol0">
                    <DiskID>0</DiskID>
                    <WillWipeDisk>true</WillWipeDisk>
                    <!-- El ORDEN de los elementos lo impone el esquema XSD y Setup lo
                         respeta: CreatePartition es Order, Size, Type, Extend y
                         ModifyPartition es Order, PartitionID, Active, Format, Label.
                         Con otro orden el XML es well-formed pero Setup responde
                         "The answer file is invalid for pass [windowsPE]". -->
                    <CreatePartitions>
                      <CreatePartition wcm:action="add">
                        <Order>1</Order>
                        <Size>2048</Size>
                        <Type>Primary</Type>
                      </CreatePartition>
                      <!-- Sin esta particion, ModifyPartition/ImageInstall apuntan a
                           PartitionID 2 que nunca se creaba: Setup fallaba. -->
                      <CreatePartition wcm:action="add">
                        <Order>2</Order>
                        <Type>Primary</Type>
                        <Extend>true</Extend>
                      </CreatePartition>
                    </CreatePartitions>
                    <ModifyPartitions>
                      <ModifyPartition wcm:action="add">
                        <Order>1</Order>
                        <PartitionID>1</PartitionID>
                        <Format>NTFS</Format>
                        <Label>System</Label>
                      </ModifyPartition>
                      <ModifyPartition wcm:action="add">
                        <Order>2</Order>
                        <PartitionID>2</PartitionID>
                        <Active>true</Active>
                        <Format>NTFS</Format>
                        <Label>Windows</Label>
                      </ModifyPartition>
                    </ModifyPartitions>
                  </Disk>
                </DiskConfiguration>
                <!-- ImageInstall y UserData son HERMANOS de DiskConfiguration, no
                     hijos. Anidados dentro, el XML sigue siendo well-formed (xmllint
                     pasa) pero es invalido contra el esquema de Microsoft-Windows-Setup
                     y Setup aborta con "a component or setting specified in
                     autounattend.xml for pass [windowsPE] is missing or invalid".
                     Confirmado por OCR en la corrida de diagnostico 37108788618. -->
                <ImageInstall>
                  <OSImage>
                    <InstallFrom>
                      <MetaData wcm:action="add">
                        <Key>/IMAGE/INDEX</Key>
                        <Value>IMAGE_INDEX</Value>
                      </MetaData>
                    </InstallFrom>
                    <InstallTo>
                      <DiskID>0</DiskID>
                      <PartitionID>2</PartitionID>
                    </InstallTo>
                    <WillShowUI>OnError</WillShowUI>
                    <Compact>true</Compact>
                  </OSImage>
                </ImageInstall>
                <UserData>
                  <!-- SIN ProductKey. El placeholder A00001-... hace que Setup
                       responda "The answer file is invalid" para el pase
                       [windowsPE] (probado en la variante D del diagnostico
                       37111272809). Y no hace falta: la variante virtio del
                       round 4 (37114599458) instalo desatendida sin clave
                       nenhuma, con este mismo DiskConfiguration. -->
                  <AcceptEula>true</AcceptEula>
                </UserData>
              </component>
            </settings>
            <settings pass="oobeSystem">
              <component name="Microsoft-Windows-Shell-Setup"
                         processorArchitecture="amd64"
                         publicKeyToken="31bf3856ad364e35"
                         language="neutral" versionScope="nonSxS">
                <OOBE>
                  <HideEULAPage>true</HideEULAPage>
                  <HideOEMRegistrationScreen>true</HideOEMRegistrationScreen>
                  <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
                  <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>
                  <NetworkLocation>Work</NetworkLocation>
                  <ProtectYourPC>3</ProtectYourPC>
                  <SkipMachineOOBE>true</SkipMachineOOBE>
                  <SkipUserOOBE>true</SkipUserOOBE>
                </OOBE>
              </component>
            </settings>
            <settings pass="specialize">
              <component name="Microsoft-Windows-Shell-Setup"
                         processorArchitecture="amd64"
                         publicKeyToken="31bf3856ad364e35"
                         language="neutral" versionScope="nonSxS">
                <RunSynchronous>
                  <RunSynchronousCommand wcm:action="add">
                    <Order>1</Order>
                    <Path>reg add "HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management" /v PagingFiles /t REG_MULTI_SZ /d "" /f</Path>
                    <Description>dejar pagefile en cero</Description>
                  </RunSynchronousCommand>
                  <RunSynchronousCommand wcm:action="add">
                    <Order>2</Order>
                    <Path>powercfg /hibernate off</Path>
                    <Description>sin hiberfil.sys</Description>
                  </RunSynchronousCommand>
                </RunSynchronous>
              </component>
            </settings>
          </unattend>
          XML
          INDICE="${{ github.event.inputs.wim_index }}"
          INDICE="${INDICE:-$INDICE_WIM}"
          echo "usando indice de imagen: $INDICE"
          sed -i "s|IMAGE_INDEX|$INDICE|" aio/autoinstall.xml
          # Well-formedness real: si el unattend no parsea, Setup arranca la UI
          # interactiva y el job se queda colgado 2 h sin explicar por que.
          sudo apt-get install -y -qq libxml2-utils > /dev/null
          if ! xmllint --noout aio/autoinstall.xml; then
            echo "::error::autoinstall.xml NO es well-formed; Setup lo ignoraria"
            exit 1
          fi
          echo "autoinstall.xml: well-formed y con Compact=true"
          echo "unattend escrito; Compact=true presente: $(grep -c '<Compact>true</Compact>' aio/autoinstall.xml)"

          # autounattend.xml debe aparecer en la raiz de un medio extraible.
          # Un fichero suelto no sirve: se empaqueta en una imagen FAT12/16 minima.
          sudo apt-get install -y -qq dosfstools mtools > /dev/null
          # 16 MiB, no 2 MiB: FAT16 exige >=4085 clusters y con 512 B/sector
          # eso exige >2 MiB. Con 2 MiB mkfs.vfat aborta con
          # "too small or a too large filesystem".
          dd if=/dev/zero of=aio/autounattend.img bs=1M count=16 status=none
          mkfs.vfat -F 16 -n UNATTEND aio/autounattend.img > /dev/null
          mcopy -i aio/autounattend.img aio/autoinstall.xml ::autounattend.xml
          echo "--- contenido de la imagen FAT (CD) ---"
          mdir -i aio/autounattend.img ::

          # Ademas del CD, una copia en DISQUETE (fd0). Setup busca autounattend.xml
          # por orden: disquete, CD/DVD, USB. Tenerlo en ambos cubre el caso de que
          # no enumere el segundo CD.
          rm -f aio/autounattend.flp
          dd if=/dev/zero of=aio/autounattend.flp bs=512 count=2880 status=none
          mkfs.vfat -F 12 -n UNATTEND aio/autounattend.flp > /dev/null
          mcopy -i aio/autounattend.flp aio/autoinstall.xml ::autounattend.xml
          echo "--- contenido de la imagen FAT (disquete 1.44 MB) ---"
          mdir -i aio/autounattend.flp ::

      # ------------------------------------------------------------------
      # Etapa 5 — sampler en el HOST, corriendo antes de que arranque Setup
      # ------------------------------------------------------------------
      - name: arrancar-sampler-y-Setup
        shell: bash
        run: |
          set -euo pipefail

          # Census justo ANTES de Setup. Sirve para separar el coste de la
          # acquisition (ISO + tools) del pico propio de Windows Setup, que es
          # lo que la aceptacion del laboratorio realmente mide.
          AVAIL_PRE_SETUP=$(df -B1 --output=avail / | tail -1 | tr -d ' ')
          echo "AVAIL_PRE_SETUP_BYTES=$AVAIL_PRE_SETUP" >> "$GITHUB_ENV"
          echo "avail pre-Setup: $AVAIL_PRE_SETUP bytes"
          {
            echo "--- censo pre-Setup ---"
            echo "avail_pre_setup_bytes=$AVAIL_PRE_SETUP"
            echo "dispositivo_de_raiz=$(df -B1 --output=source / | tail -1 | tr -d ' ')"
            echo "dispositivo_del_workspace=$(df -B1 --output=source "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ')"
            echo "iso_bytes=${{ github.event.inputs.iso_size_bytes }}"
            echo "target_gb=${{ github.event.inputs.target_gb }}"
          } | tee -a medicion/censo-pre-setup.md

          cat > sampler.sh <<SH
          #!/bin/bash
          # Debe escribir en "\$WS/samples.tsv": es la ruta que lee el paso de
          # medicion. Escribirlo en medicion/ dejaba samples.tsv inexistente.
          WS="$GITHUB_WORKSPACE"
          while true; do
            AVAIL=\$(df -B1 --output=avail / | tail -1 | tr -d ' ')
            TARGET=\$(du -B1 "\$WS/lab/objetivo.qcow2" 2>/dev/null | cut -f1)
            [ -z "\$TARGET" ] && TARGET=0
            # printf y no echo: con echo el "\t" se escribia LITERAL y awk -F'\t'
            # no dividia los campos, dejando minimo.txt vacio.
            printf '%s\t%s\t%s\n' "\$(date +%s)" "\$AVAIL" "\$TARGET" >> "\$WS/samples.tsv"
            sleep 2
          done
          SH
          chmod +x sampler.sh
          nohup ./sampler.sh > sampler.log 2>&1 &
          echo $! > sampler.pid
          sleep 3
          echo "sampler pid $(cat sampler.pid); primera muestra:"
          cat samples.tsv
          if [ ! -s samples.tsv ]; then
            echo "::error::el sampler no produjo muestras:"
            cat sampler.log
            exit 1
          fi

      - name: instalar-14393-con-compact-os
        shell: bash
        run: |
          set -uo pipefail
          PREFIJO="${QEMU_PREFIJO:-}"
          echo "ejecutando QEMU con prefijo '${PREFIJO:-ninguno}'"
          echo "--- qemu-system-x86_64 --version ---"
          $PREFIJO qemu-system-x86_64 --version | head -1
          echo "--- argumentos ---"

          # Watchdog: WillShowUI=OnError hace que Setup muestre UI ante cualquier
          # error y se quede esperando para siempre. Sin limite, un cuelgue consumia
          # los 240 min del job sin dejar ver nada. rc=124 -> vigilante disparado.
          VIGILANTE_MIN=${{ github.event.inputs.watchdog_minutes }}
          echo "vigilante de QEMU: ${VIGILANTE_MIN} min"

          # Capturas periodicas por el monitor HMP: distinguir "compactando lento"
          # de "colgado en una pantalla de dialogo" sin adivinar.
          # Cliente HMP propio en Python: con socat (escribir y cerrar al instante)
          # no se obtiene ninguna captura, porque el handshake del monitor no
          # llega a completarse.
          cat > hmp.py <<'PY'
          import socket, sys, time

          def hmp(sock_path, comando):
              s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
              s.settimeout(15)
              try:
                  s.connect(sock_path)
                  time.sleep(0.3)
                  try:
                      s.recv(65536)
                  except Exception:
                      pass
                  s.sendall((comando + "\n").encode())
                  time.sleep(1.5)
                  try:
                      return s.recv(65536).decode(errors="replace")
                  except Exception:
                      return ""
              finally:
                  s.close()

          ruta, salida, limite, intervalo = sys.argv[1], sys.argv[2], int(sys.argv[3]), float(sys.argv[4])
          for i in range(1, limite + 1):
              time.sleep(intervalo)
              destino = "%s/t%03d.ppm" % (salida, i)
              r = hmp(ruta, 'screendump "%s"' % destino)
              print("captura %03d -> %s  (%r)" % (i, destino, r.strip()[:100]), flush=True)
          PY

          mkdir -p medicion/pantallas
          rm -f monitor.sock
          ( python3 hmp.py "$GITHUB_WORKSPACE/monitor.sock" \
              "$GITHUB_WORKSPACE/medicion/pantallas" 120 45 > hmp.log 2>&1 ) &

          # GNU timeout toma un numero desnudo como SEGUNDOS. Sin la "m" final,
          # "150" significa 150 s y el vigilante mataba a QEMU en 2,5 min (rc 124).
          # GitHub ejecuta los pasos con bash -e, asi que un rc=124 del vigilante
          # abortaba el paso entero: QEMU_RC no se guardaba y las capturas nunca
          # se procesaban. Hay que desactivar -e alrededor de esta llamada.
          set +e
          timeout --signal=TERM --kill-after=60 "${VIGILANTE_MIN}m" \
          $PREFIJO qemu-system-x86_64 \
            -accel kvm \
            -m "${{ github.event.inputs.vm_ram_mb }}" \
            -smp 4 \
            -machine pc \
            -vga std \
            -drive file=lab/objetivo.qcow2,if=virtio,format=qcow2 \
            -drive file=iso/instalador.iso,if=ide,media=cdrom,readonly=on \
            -drive file=aio/autounattend.img,if=ide,media=cdrom,readonly=on \
            -drive file=aio/autounattend.flp,if=floppy,format=raw \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -display none -serial file:consola-serial.log \
            -monitor unix:monitor.sock,server,nowait \
            -debugcon file:debugcon.log -global isa-debugcon.iobase=0x402 \
            -rtc base=localtime \
            -boot d \
            -no-reboot > qemu-stdout.log 2>&1 &
          QPID=$!

          # Conectar a un socket unix exige permiso de ESCRITURA. QEMU arranca como
          # root (por KVM) y crea el socket 0755, asi que el cliente HMP del usuario
          # runner recibe PermissionError y no captura nada. El chmod tiene que
          # hacerse MIENTRAS QEMU corre: si se hace despues, el socket ya no sirve
          # y el cliente ya fallo.
          for i in $(seq 1 60); do
            [ -S monitor.sock ] && break
            sleep 1
          done
          if [ -S monitor.sock ]; then
            $PREFIJO chmod 0666 monitor.sock && echo "monitor.sock permiso 0666"
          else
            echo "::warning::no se creo monitor.sock; no habra capturas"
          fi

          wait "$QPID"
          RC=$?
          set -e

          if [ "$RC" = "124" ]; then
            echo "::error::el vigilante de ${VIGILANTE_MIN} min se disparo: Setup no terminó"
          fi
          echo "qemu termino con codigo $RC"
          echo "QEMU_RC=$RC" >> "$GITHUB_ENV"
          sleep 3
          pkill -f "hmp.py" 2>/dev/null || true
          echo "capturas de pantalla tomadas: $(ls medicion/pantallas | wc -l)"
          echo "--- log del cliente HMP ---"
          head -5 hmp.log 2>/dev/null || true
          echo "--- salida de QEMU ---"
          head -10 qemu-stdout.log 2>/dev/null || true

          # El artifact no debe llevar cientos de MB: conserva las 2 primeras y
          # las 12 ultimas capturas, y convierte a PNG.
          sudo apt-get install -y -qq netpbm > /dev/null 2>&1 || true
          mapfile -t SHOTS < <(ls -1 medicion/pantallas/*.ppm 2>/dev/null || true)
          if [ "${#SHOTS[@]}" -gt 14 ]; then
            KEEP=( "${SHOTS[@]:0:2}" "${SHOTS[@]: -12}" )
            for f in "${SHOTS[@]}"; do
              case " ${KEEP[*]} " in *" $f "*) ;; *) rm -f "$f" ;; esac
            done
          fi
          for f in medicion/pantallas/*.ppm; do
            [ -e "$f" ] || continue
            pnmtopng "$f" > "${f%.ppm}.png" 2>/dev/null && rm -f "$f"
          done
          echo "capturas conservadas: $(ls -1 medicion/pantallas | wc -l)"

          # OCR de las capturas:Setup deja su estado real escrito en pantalla
          # ("a component or setting specified in autounattend.xml for pass
          # [windowsPE] is missing or invalid", "Windows is loading files", etc.).
          # Es la unica evidencia directa de EN QUE punto se quedo, y resulto
          # decisiva para localizar la causa raiz.
          sudo apt-get install -y -qq --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng > /dev/null 2>&1 || true
          if command -v tesseract > /dev/null 2>&1; then
            for f in medicion/pantallas/*.png; do
              [ -e "$f" ] || continue
              tesseract "$f" "${f%.png}" -l eng --psm 6 2>/dev/null || true
            done
            : > medicion/pantallas/OCR.md
            for t in medicion/pantallas/*.txt; do
              [ -e "$t" ] || continue
              { echo "### $(basename "$t")"; echo; cat "$t"; echo; } >> medicion/pantallas/OCR.md
            done
            rm -f medicion/pantallas/*.txt
            echo "--- OCR de las pantallas ---"
            cat medicion/pantallas/OCR.md
          else
            echo "::warning::tesseract no disponible, sin OCR"
          fi
          cp debugcon.log qemu-stdout.log medicion/ 2>/dev/null || true
          echo "--- prueba de arranque (SeaBIOS) ---"
          grep -E 'Booting from|boot failed|CDROM|Floppy' debugcon.log 2>/dev/null | head -20 || true

          if [ ! -f consola-serial.log ]; then
            echo "::error::QEMU no llego a arrancar (sin consola-serial.log). rc=$RC"
            exit 1
          fi
          echo "--- primeras lineas de la consola serial ---"
          head -40 consola-serial.log || true
          echo "--- ultimas lineas de la consola serial ---"
          tail -30 consola-serial.log || true

          # Autopsia del disco destino: evidencia objetiva de si Setup escribio.
          # Un qcow2 sin tabla de particiones significa que Setup no instalo nada.
          echo "--- autopsia del disco destino ---"
          qemu-img info lab/objetivo.qcow2 2>&1 | tee medicion/disco-despues-info.txt || true
          if sudo qemu-nbd --connect /dev/nbd0 lab/objetivo.qcow2 2>/dev/null; then
            sudo fdisk -l /dev/nbd0 2>&1 | tee medicion/disco-despues-fdisk.txt || true
            sudo blkid /dev/nbd0p1 /dev/nbd0p2 2>&1 | tee medicion/disco-despues-blkid.txt || true
            sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null || true
          else
            echo "no se pudo montar el qcow2 para inspeccionarlo" | tee medicion/disco-despues-fdisk.txt
          fi
          PARTICIONES=$(grep -c '^/dev/nbd0p' medicion/disco-despues-fdisk.txt 2>/dev/null || echo 0)
          echo "particiones detectadas en el destino: $PARTICIONES"

      # ------------------------------------------------------------------
      # Etapa 6 — peak real, tablas y veredictos
      # ------------------------------------------------------------------
      - name: medir-y-emitir-veredicto
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          kill "$(cat sampler.pid)" 2>/dev/null || true
          sleep 2

          AVAIL_INICIAL="${AVAIL_INICIAL_BYTES:-0}"
          # El paso que escribe el censo lo exporta como AVAIL_PRE_SETUP_BYTES.
          # Leer AVAIL_PRE_SETUP (nombre incorrecto) daba 0 y contaminaba el pico.
          AVAIL_PRE_SETUP="${AVAIL_PRE_SETUP_BYTES:-0}"
          DISCO_TOTAL="${DISCO_TOTAL_BYTES:-0}"
          ISO_BYTES="${ISO_BYTES:-0}"
          QEMU_RC="${QEMU_RC:-999}"
          SKU="${SKU:-desconocido}"

          # El calculo va ANTES de cualquier validacion: la guarda se apoyaba en
          # minimo.txt y lo comprobaba antes de que existiera, disparando siempre.
          awk -F'\t' 'NR==1{min=$2} $2<min{min=$2; lin=$1} END{print min > "minimo.txt"; print lin > "minimo_ts.txt"}' samples.tsv
          awk -F'\t' 'NR==1{max=$2} $2>max{max=$2} END{print max+0 > "maximo.txt"}' samples.tsv
          awk -F'\t' 'BEGIN{m=0} $3>m{m=$3} END{print m+0 > "pico_destino.txt"}' samples.tsv

          if [ ! -s samples.tsv ]; then
            echo "::warning::no hay muestras: la sonda no llego a arrancar QEMU"
            {
              echo "## Resultado de la medicion"
              echo
              echo "**SIN MEDICION.** La sonda fallo antes de arrancar Windows Setup."
              echo
              echo "| Magnitud | Bytes | GiB |"
              echo "|---|---:|---:|"
              echo "| Espacio libre inicial real del runner | $AVAIL_INICIAL | $(awk "BEGIN{printf \"%.3f\",$AVAIL_INICIAL/1073741824}") |"
              echo "| Presupuesto efectivo tras limpiar | ${PRESUPUESTO_EFECTIVO_BYTES:-0} | $(awk "BEGIN{printf \"%.3f\",${PRESUPUESTO_EFECTIVO_BYTES:-0}/1073741824}") |"
              echo "| Espacio ocupado por la ISO | $ISO_BYTES | $(awk "BEGIN{printf \"%.3f\",$ISO_BYTES/1073741824}") |"
              echo
              echo "- clase de runner: $SKU"
              echo "- qemu salio con codigo: $QEMU_RC (999 = nunca llego a ejecutarse)"
              echo "- ver el paso fallido en el log del job"
              echo
              echo "### COMPACT-OS-BUILD: NO MEDIDO"
            } | tee medicion/VEREDICTO.md
            cat medicion/VEREDICTO.md >> "$GITHUB_STEP_SUMMARY"
            echo "avail_inicial_bytes=$AVAIL_INICIAL" > medicion/resultado.csv
            echo "veredicto=NO-MEDIDO" >> medicion/resultado.csv
            echo "sku=$SKU" >> medicion/resultado.csv
            echo "qemu_rc=$QEMU_RC" >> medicion/resultado.csv
            exit 0
          fi

          MIN_AVAIL=$(cat minimo.txt)
          # Guardia post-calculo: sin esto un MIN_AVAIL vacio hacia que PICO
          # arrastrara AVAIL_INICIAL entero y el veredicto reportaba 86 GiB de
          # consumo que nunca ocurrieron.
          if [ -z "$MIN_AVAIL" ]; then
            echo "::error::minimo.txt vacio; no hay minimo calculable de espacio libre"
            exit 1
          fi

          MAX_AVAIL=$(cat maximo.txt)
          # El pico NO se mide contra AVAIL_INICIAL: esa cifra es de antes de
          # limpiar toolchains, y la limpieza devuelve espacio. Por eso el minimo
          # posterior puede superar a AVAIL_INICIAL y el pico salia NEGATIVO
          # (-30.446.538.752 B en la corrida 37100230898), que no es un consumo.
          # La base correcta es el maximo de espacio libre observado por el sampler,
          # que arranca antes de QEMU: el pico es la caida desde ahi.
          PICO=$(( MAX_AVAIL - MIN_AVAIL ))
          [ "$PICO" -lt 0 ] && PICO=0
          # Pico atribuible solo a Windows Setup: desde el censo pre-Setup hasta
          # el peor momento. Es la magnitud que decide si el piso de 14 GB basta.
          PICO_SETUP=$(( ${AVAIL_PRE_SETUP:-0} - MIN_AVAIL ))
          [ "$PICO_SETUP" -lt 0 ] && PICO_SETUP=0
          PICO_DESTINO=$(cat pico_destino.txt)
          RESIDUO=$(( PICO - ISO_BYTES - PICO_DESTINO ))
          [ "$RESIDUO" -lt 0 ] && RESIDUO=0
          FINAL=$(du -B1 lab/objetivo.qcow2 2>/dev/null | cut -f1 || echo 0)

          # Si el disco destino nunca crecio, no hay medicion que reportar: Setup
          # no instalo nada. Presentar un "pico" en ese caso seria falso.
          ESCRIBIO=1
          if [ "$QEMU_RC" != "999" ] && [ "$PICO_DESTINO" -lt 10485760 ]; then
            ESCRIBIO=0
          fi

          if [ "$ESCRIBIO" -eq 0 ]; then
            VEREDICTO="NO-INSTALADO"
          elif [ "$MIN_AVAIL" -ge 2147483648 ] && [ "$QEMU_RC" -eq 0 ]; then
            VEREDICTO="VIABLE"
          else
            VEREDICTO="NO-VIABLE"
          fi
          if [ "$SKU" != "piso" ]; then
            CONCLUYENTE="NO-CONCLUYENTE (aterrizo en el SKU de 4 nucleos, no en el piso garantizado)"
          else
            CONCLUYENTE="SI (aterrizo en el piso garantizado)"
          fi

          {
            echo "## Resultado de la medicion"
            echo
            echo "### Consumo del runner"
            echo
            echo "| Magnitud | Bytes | GiB |"
            echo "|---|---:|---:|"
            echo "| Espacio libre inicial real del runner | $AVAIL_INICIAL | $(awk "BEGIN{printf \"%.3f\",$AVAIL_INICIAL/1073741824}") |"
            echo "| Espacio libre tras limpiar toolchains | ${PRESUPUESTO_EFECTIVO_BYTES:-0} | $(awk "BEGIN{printf \"%.3f\",${PRESUPUESTO_EFECTIVO_BYTES:-0}/1073741824}") |"
            echo "| Espacio libre justo antes de Setup | ${AVAIL_PRE_SETUP:-0} | $(awk "BEGIN{printf \"%.3f\",${AVAIL_PRE_SETUP:-0}/1073741824}") |"
            echo
            echo "### Pico durante Windows Setup + Compact OS"
            echo
            echo "| Magnitud | Bytes | GiB |"
            echo "|---|---:|---:|"
            echo "| Espacio libre en el peor momento | $MIN_AVAIL | $(awk "BEGIN{printf \"%.3f\",$MIN_AVAIL/1073741824}") |"
            echo "| Espacio libre maximo observado por el sampler | $MAX_AVAIL | $(awk "BEGIN{printf \"%.3f\",$MAX_AVAIL/1073741824}") |"
            echo "| **Pico de consumo de Setup** | $PICO_SETUP | $(awk "BEGIN{printf \"%.3f\",$PICO_SETUP/1073741824}") |"
            echo "| Espacio ocupado por la ISO | $ISO_BYTES | $(awk "BEGIN{printf \"%.3f\",$ISO_BYTES/1073741824}") |"
            echo "| Espacio ocupado por el disco destino (maximo) | $PICO_DESTINO | $(awk "BEGIN{printf \"%.3f\",$PICO_DESTINO/1073741824}") |"
            echo "| Temporales de Setup + auxiliares (residuo) | $RESIDUO | $(awk "BEGIN{printf \"%.3f\",$RESIDUO/1073741824}") |"
            echo "| **Pico maximo real total** | $PICO | $(awk "BEGIN{printf \"%.3f\",$PICO/1073741824}") |"
            echo "| Tamano final del disco destino | $FINAL | $(awk "BEGIN{printf \"%.3f\",$FINAL/1073741824}") |"
            echo
            echo "- muestras tomadas: $(wc -l < samples.tsv)"
            echo "- instante del minimo (epoch): $(cat minimo_ts.txt 2>/dev/null || echo n/d)"
            echo "- qemu salio con codigo: $QEMU_RC"
            echo "- clase de runner: $SKU"
            echo "- conclusion: $CONCLUYENTE"
            echo
            if [ "$ESCRIBIO" -eq 0 ]; then
              echo "### ATENCION: NO MEDIDO"
              echo
              echo "El disco destino se quedo en $PICO_DESTINO bytes: Setup **no instalo nada**."
              echo "El pico de consumo de Setup de la tabla anterior no es una medicion valida de"
              echo "Windows Setup, es el ruido del qcow2 recien creado. El texto de la pantalla esta"
              echo "en \`medicion/pantallas/OCR.md\`."
            fi
            echo
            echo "### COMPACT-OS-BUILD: $VEREDICTO"
          } | tee medicion/VEREDICTO.md
          cat medicion/VEREDICTO.md >> "$GITHUB_STEP_SUMMARY"

          {
            echo "avail_inicial_bytes=$AVAIL_INICIAL"
            echo "presupuesto_efectivo_bytes=${PRESUPUESTO_EFECTIVO_BYTES:-0}"
            echo "avail_pre_setup_bytes=${AVAIL_PRE_SETUP:-0}"
            echo "iso_bytes=$ISO_BYTES"
            echo "disco_destino_pico_bytes=$PICO_DESTINO"
            echo "min_avail_bytes=$MIN_AVAIL"
            echo "max_avail_bytes=$MAX_AVAIL"
            echo "pico_setup_bytes=$PICO_SETUP"
            echo "pico_bytes=$PICO"
            echo "disco_destino_final_bytes=$FINAL"
            echo "residuo_bytes=$RESIDUO"
            echo "sku=$SKU"
            echo "qemu_rc=$QEMU_RC"
            echo "veredicto=$VEREDICTO"
            echo "concluyente=$CONCLUYENTE"
          } > medicion/resultado.csv

          sudo cp samples.tsv medicion/samples.tsv 2>/dev/null || cp samples.tsv medicion/samples.tsv
          sudo umount iso/montada 2>/dev/null || true
          cp consola-serial.log medicion/ 2>/dev/null || true

      - name: subir-informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medicion-pico-construccion
          path: medicion/
          retention-days: 30
